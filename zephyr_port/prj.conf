# General configuration
CONFIG_MAIN_STACK_SIZE=2048

# Enable GPIO
CONFIG_GPIO=y
CONFIG_GPIO_STM32=y

# Enable SPI
CONFIG_SPI=y
CONFIG_SPI_STM32=y

# Enable I2C
CONFIG_I2C=y
CONFIG_I2C_STM32=y

# Enable ADC if needed
CONFIG_ADC=n

# Enable PWM for heater control
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# Enable RTC for time keeping
CONFIG_RTC=n

# Enable Flash storage for settings
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Enable WiFi (will need external module)
CONFIG_WIFI=n
CONFIG_NET_L2_WIFI=y

# Enable MQTT if WiFi is enabled
CONFIG_MQTT=y
CONFIG_MQTT_HELPER=y

# Enable serial console for debugging
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable threading
CONFIG_MULTITHREADING=y
CONFIG_WORKQUEUE=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# Memory optimizations for STM32L031K6
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable unused features to save space
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_TEST_ARM_CORTEX_M=n

# Enable minimal printf support
CONFIG_CBPRINTF_NANO=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_NEWLIB_LIBC=y

# Enable specific STM32L0 series features
CONFIG_SOC_FAMILY_STM32L0XX=y
CONFIG_SOC_SERIES_STM32L0X1=y
CONFIG_BOARD_NUCLEO_L031K6=y

# Power management
CONFIG_PM=y
CONFIG_DEVICE_POWER_MANAGEMENT=y

# USB CDC ACM for console (optional)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y